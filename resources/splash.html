<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Multicarnes POS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #cc1c1c;
        color: #ffffff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        position: relative;
      }
      .logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
      }
      .title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-top: 4px;
      }
      .subtitle {
        font-size: 13px;
        opacity: 0.85;
        margin-top: -8px;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 8px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .footer {
        position: absolute;
        bottom: 14px;
        font-size: 11px;
        opacity: 0.6;
        letter-spacing: 0.3px;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="./icon.png" alt="" />
    <div class="title">Multicarnes POS</div>
    <div class="subtitle">Sistema de Punto de Venta</div>
    <div class="spinner"></div>
    <div class="footer">Cargando...</div>
  </body>
</html>
