name: E2E (Playwright + Electron)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright suite (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall (electron-builder install-app-deps) rebuilds better-sqlite3
      # against Electron's ABI so the launched binary can read the DB. Do NOT
      # add `npm rebuild better-sqlite3` here — that targets Node and breaks
      # the Electron binding.
      - run: npm ci

      # Playwright needs system libs to run headed-mode Electron under xvfb
      # (no proper headless mode in Electron). --with-deps installs them.
      - run: npx playwright install --with-deps chromium

      # System libs Electron itself needs on Linux.
      - name: Install Electron Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgbm1 libnss3 libasound2t64 libgtk-3-0 \
            libxss1 libxshmfence1 xvfb

      # electron-vite produces out/main/index.js; the e2e helper launches it.
      - run: npm run build

      # xvfb-run provides a virtual display for the Electron windows.
      - name: Run Playwright tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npx playwright test
        env:
          CI: 'true'

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
