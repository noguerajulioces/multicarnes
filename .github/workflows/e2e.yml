name: E2E (Playwright + Electron)

# The POS is deployed on Windows, so the e2e suite runs on windows-latest
# to validate the actual target environment. Mac developers can run the same
# suite locally; CI is the authoritative pass/fail signal for Windows.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright suite (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall (electron-builder install-app-deps) rebuilds better-sqlite3
      # against Electron's ABI on Windows. Do NOT add `npm rebuild better-sqlite3`
      # — that targets Node and breaks the Electron binding.
      - run: npm ci

      # electron-vite produces out/main/index.js; the e2e helper launches it.
      - run: npm run build

      # Windows Server has a real display server, so no xvfb wrapper is needed.
      # Electron runs in headed mode and Playwright drives it via CDP.
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
