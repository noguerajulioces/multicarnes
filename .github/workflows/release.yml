name: Release

# Triggered when release-it pushes a tag like `v1.2.3`. The workflow builds
# installers for each platform in parallel and then publishes a single
# GitHub Release with every artifact attached.
on:
  push:
    tags:
      - 'v*'

# `contents: write` is required by the final job to create the GitHub Release
# and upload assets using the built-in GITHUB_TOKEN (no PAT needed).
permissions:
  contents: write

# Releases must run to completion — never cancel an in-flight tag build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact_name: installers-windows
          - os: ubuntu-latest
            script: build:linux
            artifact_name: installers-linux
          - os: macos-latest
            script: build:mac
            artifact_name: installers-macos
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs `postinstall`, which calls `electron-builder install-app-deps`
      # to rebuild native modules (better-sqlite3, node-thermal-printer) against
      # the Electron ABI of the target platform.
      - name: Install dependencies
        run: npm ci

      # Each platform script does: typecheck -> electron-vite build -> electron-builder.
      # Output goes to `dist/` per electron-builder defaults.
      # GH_TOKEN is embedded into app-update.yml so the installed client can read
      # releases from the private repo. GH_PAT must be set as a repo secret with
      # `repo` scope (classic PAT).
      - name: Build & package
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      # Installers + electron-updater metadata (latest*.yml, .blockmap) are
      # required for auto-update to work.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `merge-multiple: true` flattens every artifact directory into one folder
      # so the glob below picks up all platform installers in a single shot.
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts

      # `generate_release_notes: true` asks GitHub to produce notes from the
      # commits between this tag and the previous one. The CHANGELOG.md
      # generated by release-it stays as the canonical, in-repo history.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/latest*.yml
            artifacts/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
