name: Release

# Triggered when release-it pushes a tag like `v1.2.3`. Builds the Windows
# installer and publishes it directly to a GitHub Release. No intermediate
# `upload-artifact` step is used, so this never touches the Actions artifact
# storage quota (Release assets are stored separately).
on:
  push:
    tags:
      - 'v*'

# `contents: write` is required to create the GitHub Release and upload assets
# using the built-in GITHUB_TOKEN (no PAT needed).
permissions:
  contents: write

# Releases must run to completion — never cancel an in-flight tag build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs `postinstall`, which calls `electron-builder install-app-deps`
      # to rebuild native modules (better-sqlite3, node-thermal-printer) against
      # the Electron ABI.
      - name: Install dependencies
        run: npm ci

      # Does: typecheck -> electron-vite build -> electron-builder --win.
      # Output goes to `dist/` per electron-builder defaults.
      # GH_TOKEN is embedded into app-update.yml so the installed client can read
      # releases from the private repo. GH_PAT must be set as a repo secret with
      # `repo` scope (classic PAT).
      - name: Build & package
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      # Upload the installer + electron-updater metadata (latest.yml, .blockmap)
      # straight to the GitHub Release. These do NOT count against the Actions
      # artifact storage quota.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
