name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, integration tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Integration tests run vitest against an in-memory better-sqlite3. The
      # pretest:integration hook rebuilds the native binding against the Node
      # ABI; we flip it back to the Electron ABI before `npm run build` so the
      # bundled artifact ships with the correct binary.
      - run: npm run test:integration

      - run: npm run rebuild:electron

      - run: npm run build
